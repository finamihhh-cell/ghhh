<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Алтан Галактик</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #2b1d03 0%, #110b01 55%, #030201 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fffbeb;
      height: 100vh;
      width: 100vw;
      user-select: none;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    @keyframes softFadeDown {
      0% { opacity: 0; transform: translate(-50%, -18px); filter: blur(10px); }
      100% { opacity: 1; transform: translate(-50%, 0); filter: blur(0); }
    }

    @keyframes softFadeUp {
      0% { opacity: 0; transform: translate(-50%, 18px); filter: blur(10px); }
      100% { opacity: 1; transform: translate(-50%, 0); filter: blur(0); }
    }

    .top-header {
      position: fixed;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      width: 92%;
      pointer-events: none;
      opacity: 0;
      animation: softFadeDown 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
    }

    .top-header h1 {
      font-size: clamp(1.3rem, 4.2vw, 2.2rem);
      font-weight: 700;
      color: #fde047;
      text-shadow: 0 0 12px rgba(254, 249, 195, 0.9), 0 0 28px rgba(250, 204, 21, 0.78), 0 0 58px rgba(234, 179, 8, 0.45);
      letter-spacing: 0.8px;
      margin-bottom: 5px;
    }

    .top-header p {
      font-size: clamp(0.78rem, 2.3vw, 0.96rem);
      color: rgba(254, 249, 195, 0.82);
      text-shadow: 0 0 14px rgba(250, 204, 21, 0.45);
    }

    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: 95%;
      opacity: 0;
      animation: softFadeUp 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards;
    }

    button {
      background: rgba(250, 204, 21, 0.14);
      border: 1px solid rgba(253, 224, 71, 0.55);
      color: #fef08a;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.28), inset 0 0 12px rgba(254, 240, 138, 0.14);
      transition: transform 0.15s ease, background 0.15s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.94);
      background: rgba(250, 204, 21, 0.35);
    }
  </style>
</head>
<body>
  <div class="top-header">
    <h1>✨ Алтан Цэцгийн 3D Галактик ✨</h1>
    <p>1 хуруугаар эргүүлнэ • 2 хуруугаар чимхэж томруулна</p>
  </div>

  <canvas id="galaxyCanvas"></canvas>

  <div class="controls">
    <button type="button" onclick="triggerBurst()">✨ Гэрэл цацруулах</button>
    <button type="button" onclick="cycleMessage()">💛 Зурвас солих</button>
    <button type="button" onclick="resetCameraZoom()">↺ Хэмжээ засах</button>
  </div>

  <script>
    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY, fov, sceneScale;
    let rotX = 0.42;
    let rotY = 0;

    // 2 хуруугаар томруулж жижигрүүлэх камерын zoom
    let cameraZoom = 1;
    let targetZoom = 1;
    let pinchStartDist = 0;
    let pinchStartZoom = 1;
    let isPinching = false;

    let isDragging = false;
    let dragMoved = false;
    let lastX = 0;
    let lastY = 0;
    let burstPower = 0;
    let messageIndex = 0;

    let startTime = performance.now();
    const fadeDuration = 3400;

    const messages = [
      "Чи бол миний гэрэл",
      "Сайхан өдрийн мэнд",
      "Чамд зориулав 💛",
      "Гэрэлт ирээдүй",
      "Үргэлж инээмсэглэж яваарай",
      "Онцгой нэгэн"
    ];

    const photoSources = [
      "1.jpg",
      "2.jpg",
      "3.jpg"
    ];

    const floatingPhotos = [];

    photoSources.forEach((src, idx) => {
      const img = new Image();
      img.onload = () => {
        floatingPhotos.push({
          img,
          src,
          fade: 0,
          bobPhase: idx * 1.4,
          radiusFactor: 0.92 + (idx % 2) * 0.28,
          yOffset: -12 - (idx % 3) * 16,
          baseAngle: (idx / photoSources.length) * Math.PI * 2
        });
      };
      img.src = src;
    });

    function resetCameraZoom() {
      targetZoom = 1;
      burstPower = 0.6;
      spawnSparksFromScreen(centerX, centerY, 24);
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      centerX = width / 2;
      centerY = height * 0.54;
      fov = Math.min(width, height) * 0.95;
      sceneScale = Math.min(width, height) / 420;
    }

    window.addEventListener('resize', resize);
    resize();

    function project3D(x, y, z) {
      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX);
      const sinX = Math.sin(rotX);

      const x1 = x * cosY - z * sinY;
      const z1 = z * cosY + x * sinY;

      const y2 = y * cosX - z1 * sinX;
      const z2 = z1 * cosX + y * sinX;

      const cameraDist = fov * 1.15;
      const denom = cameraDist + z2;
      if (denom <= 10) return null;

      const scale = (cameraDist / denom) * cameraZoom;
      return {
        sx: centerX + x1 * scale,
        sy: centerY + y2 * scale,
        scale,
        z: z2
      };
    }

    const stars3D = [];
    const starCount = 720;

    for (let i = 0; i < starCount; i++) {
      const arm = i % 3;
      const armAngle = (arm / 3) * Math.PI * 2;
      const distNorm = Math.pow(Math.random(), 0.72);
      const r = (12 + distNorm * 195) * sceneScale;
      const spiralAngle = distNorm * 3.8;
      const theta = armAngle + spiralAngle + (Math.random() - 0.5) * 0.58;

      const thickness = (1 - distNorm * 0.65) * 38 * sceneScale;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;
      const y = (Math.random() - 0.5) * thickness;

      stars3D.push({
        x, y, z,
        orbitSpeed: (0.0012 + Math.random() * 0.0022) * (0.65 + (1 - distNorm) * 0.75),
        size: 1 + Math.random() * 2.5,
        alpha: 0.3 + Math.random() * 0.7,
        twinklePhase: Math.random() * Math.PI * 2,
        bright: Math.random() > 0.72
      });
    }

    const heart3DPoints = [];
    const heartCount = 110;
    const heartBaseScale = 4.4 * sceneScale;
    const heartCenterY3D = -72 * sceneScale;

    for (let i = 0; i < heartCount; i++) {
      const t = (i / heartCount) * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(t), 3) * heartBaseScale;
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * heartBaseScale + heartCenterY3D;
      const hz = Math.sin(t * 2) * 8 * sceneScale;
      heart3DPoints.push({ x: hx, y: hy, z: hz });
    }

    const orbitNodes3D = messages.map((text, idx) => {
      const angle = (idx / messages.length) * Math.PI * 2;
      const radius = (idx % 2 === 0 ? 115 : 152) * sceneScale;
      const y = (-8 - (idx % 3) * 14) * sceneScale;
      return { text, angle, radius, y, bobPhase: idx * 1.2 };
    });

    const sparks3D = [];

    function spawnSparksFromScreen(sx, sy, count = 28) {
      const x3d = (sx - centerX) * 0.85;
      const y3d = (sy - centerY) * 0.85;
      const z3d = (Math.random() - 0.5) * 60 * sceneScale;

      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const speed = (1.6 + Math.random() * 4.2) * sceneScale;
        sparks3D.push({
          x: x3d, y: y3d, z: z3d,
          vx: Math.sin(phi) * Math.cos(theta) * speed,
          vy: Math.cos(phi) * speed - 0.6 * sceneScale,
          vz: Math.sin(phi) * Math.sin(theta) * speed,
          size: 1.8 + Math.random() * 2.6,
          life: 1
        });
      }
    }

    function drawGoldenFlower(x, y, size, alpha, rotation = 0) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.shadowColor = 'rgba(253, 224, 71, 0.95)';
      ctx.shadowBlur = Math.max(4, size * 1.7);

      for (let i = 0; i < 5; i++) {
        ctx.rotate((Math.PI * 2) / 5);
        ctx.beginPath();
        ctx.ellipse(0, -size * 0.65, size * 0.34, size * 0.58, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(0, 0, size * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = '#fef9c3';
      ctx.fill();
      ctx.restore();
    }

    function drawRoundedImageCard(img, cx, cy, cardSize, alpha) {
      if (alpha <= 0.01) return;
      const half = cardSize / 2;
      const r = Math.max(6, cardSize * 0.16);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = 'rgba(253, 224, 71, 0.95)';
      ctx.shadowBlur = 20;

      ctx.beginPath();
      ctx.roundRect(cx - half, cy - half, cardSize, cardSize, r);
      ctx.fillStyle = '#1c1504';
      ctx.fill();

      ctx.save();
      ctx.clip();

      const iw = img.width || 1;
      const ih = img.height || 1;
      const scale = Math.max(cardSize / iw, cardSize / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      ctx.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
      ctx.restore();

      ctx.lineWidth = Math.max(1.5, cardSize * 0.045);
      ctx.strokeStyle = 'rgba(254, 249, 195, 0.95)';
      ctx.beginPath();
      ctx.roundRect(cx - half, cy - half, cardSize, cardSize, r);
      ctx.stroke();
      ctx.restore();
    }

    function triggerBurst() {
      burstPower = 1;
      const heartProj = project3D(0, heartCenterY3D, 0);
      if (heartProj) {
        spawnSparksFromScreen(heartProj.sx, heartProj.sy, 42);
      }
    }

    function cycleMessage() {
      messageIndex = (messageIndex + 1) % messages.length;
      burstPower = 0.7;
      spawnSparksFromScreen(centerX, centerY, 24);
    }

    // 2 хуруугаар шууд 3D дэлгэц дээр zoom хийх touch удирдлага
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        isPinching = true;
        isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDist = Math.hypot(dx, dy);
        pinchStartZoom = targetZoom;
      } else if (e.touches.length === 1 && !isPinching) {
        isDragging = true;
        dragMoved = false;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 2 && pinchStartDist > 0) {
        isPinching = true;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const factor = dist / pinchStartDist;
        targetZoom = Math.max(0.55, Math.min(3.5, pinchStartZoom * factor));
      } else if (e.touches.length === 1 && isDragging && !isPinching) {
        const dx = e.touches[0].clientX - lastX;
        const dy = e.touches[0].clientY - lastY;
        if (Math.hypot(dx, dy) > 4) dragMoved = true;

        rotY += dx * 0.0065;
        rotX = Math.max(0.12, Math.min(1.05, rotX + dy * 0.005));

        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        isPinching = false;
        pinchStartDist = 0;
      }
      if (e.touches.length === 0) {
        if (isDragging && !dragMoved && !isPinching) {
          const touch = e.changedTouches[0];
          if (touch) {
            burstPower = Math.max(burstPower, 0.65);
            spawnSparksFromScreen(touch.clientX, touch.clientY, 24);
          }
        }
        isDragging = false;
      }
    });

    // Компьютер дээр хулганаар эргүүлэх & scroll zoom
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragMoved = false;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      if (Math.hypot(dx, dy) > 4) dragMoved = true;

      rotY += dx * 0.0065;
      rotX = Math.max(0.12, Math.min(1.05, rotX + dy * 0.005));

      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      if (!dragMoved) {
        burstPower = Math.max(burstPower, 0.65);
        spawnSparksFromScreen(e.clientX, e.clientY, 24);
      }
      isDragging = false;
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetZoom = Math.max(0.55, Math.min(3.5, targetZoom + (e.deltaY < 0 ? 0.18 : -0.18)));
    }, { passive: false });

    let prevNow = startTime;
    let time = 0;

    function render(now) {
      const dt = Math.min(0.05, (now - prevNow) / 1000);
      prevNow = now;
      time += dt;
      burstPower *= Math.pow(0.06, dt);

      // Зөөлөн zoom шилжилт
      cameraZoom += (targetZoom - cameraZoom) * Math.min(1, dt * 14);

      const elapsed = now - startTime;
      const rawFade = Math.max(0, Math.min(1, elapsed / fadeDuration));
      const sceneFade = Math.pow(rawFade, 2.2);
      const glowFade = Math.pow(rawFade, 1.6);

      if (!isDragging && !isPinching) {
        rotY += (0.0024 + burstPower * 0.006) * (dt * 60);
      }

      ctx.clearRect(0, 0, width, height);

      const auraPulse = 0.5 + 0.5 * Math.sin(time * 2.1);

      const coreProj = project3D(0, 0, 0);
      if (coreProj && glowFade > 0.005) {
        const glowRadius = 155 * sceneScale * coreProj.scale * (1 + auraPulse * 0.14 + burstPower * 0.35);
        const coreGlow = ctx.createRadialGradient(
          coreProj.sx, coreProj.sy, 4,
          coreProj.sx, coreProj.sy, glowRadius
        );
        coreGlow.addColorStop(0, `rgba(254, 249, 195, ${(0.95 + burstPower * 0.05) * glowFade})`);
        coreGlow.addColorStop(0.24, `rgba(250, 204, 21, ${(0.62 + auraPulse * 0.1 + burstPower * 0.22) * glowFade})`);
        coreGlow.addColorStop(0.58, `rgba(234, 179, 8, ${(0.24 + auraPulse * 0.06) * glowFade})`);
        coreGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = coreGlow;
        ctx.beginPath();
        ctx.arc(coreProj.sx, coreProj.sy, glowRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      const drawList = [];

      for (const s of stars3D) {
        const stepAngle = (s.orbitSpeed + burstPower * 0.006) * (dt * 60);
        const cosA = Math.cos(stepAngle);
        const sinA = Math.sin(stepAngle);
        const nx = s.x * cosA - s.z * sinA;
        const nz = s.z * cosA + s.x * sinA;
        s.x = nx;
        s.z = nz;

        const p = project3D(s.x, s.y, s.z);
        if (!p) continue;

        const twinkle = 0.58 + 0.42 * Math.sin(time * 2.8 + s.twinklePhase);
        drawList.push({
          type: 'star',
          z: p.z, sx: p.sx, sy: p.sy,
          r: Math.max(0.5, s.size * p.scale * (1 + burstPower * 0.22)),
          alpha: s.alpha * twinkle * sceneFade,
          bright: s.bright
        });
      }

      const beatScale = 1 + Math.sin(time * 3.1) * 0.036 + burstPower * 0.14;
      const bobY = Math.sin(time * 1.7) * 5 * sceneScale;
      const projectedHeart = [];

      for (const hp of heart3DPoints) {
        const dx = hp.x * beatScale;
        const dy = (hp.y - heartCenterY3D) * beatScale + heartCenterY3D + bobY;
        const dz = hp.z * beatScale;
        const p = project3D(dx, dy, dz);
        if (p) projectedHeart.push(p);
      }

      if (projectedHeart.length > 0 && sceneFade > 0.005) {
        const avgZ = projectedHeart.reduce((acc, item) => acc + item.z, 0) / projectedHeart.length;
        const avgX = projectedHeart.reduce((acc, item) => acc + item.sx, 0) / projectedHeart.length;
        const avgY = projectedHeart.reduce((acc, item) => acc + item.sy, 0) / projectedHeart.length;
        const avgScale = projectedHeart.reduce((acc, item) => acc + item.scale, 0) / projectedHeart.length;

        drawList.push({
          type: 'heart',
          z: avgZ, pts: projectedHeart, cx: avgX, cy: avgY, scale: avgScale, alpha: sceneFade
        });
      }

      orbitNodes3D.forEach((node, idx) => {
        const a = node.angle + time * 0.22;
        const x = Math.cos(a) * node.radius;
        const z = Math.sin(a) * node.radius;
        const y = node.y + Math.sin(time * 1.9 + node.bobPhase) * 5 * sceneScale;

        const p = project3D(x, y, z);
        if (!p) return;

        const label = idx === 0 ? messages[messageIndex] : node.text;
        const depthAlpha = Math.max(0.25, Math.min(1, p.scale * 0.95));

        drawList.push({
          type: 'node',
          z: p.z, sx: p.sx, sy: p.sy, scale: p.scale,
          alpha: depthAlpha * sceneFade, label, rot: time * 0.6 + idx
        });
      });

      floatingPhotos.forEach((photo) => {
        if (photo.fade < 1) {
          photo.fade = Math.min(1, photo.fade + dt * 0.9);
        }
        const a = photo.baseAngle - time * 0.18;
        const r = 132 * sceneScale * photo.radiusFactor;
        const x = Math.cos(a) * r;
        const z = Math.sin(a) * r;
        const y = photo.yOffset * sceneScale + Math.sin(time * 1.8 + photo.bobPhase) * 6 * sceneScale;

        const p = project3D(x, y, z);
        if (!p) return;

        const cardSize = Math.max(20, 58 * sceneScale * p.scale);
        const depthAlpha = Math.max(0.35, Math.min(1, p.scale * 0.98)) * photo.fade * sceneFade;

        drawList.push({
          type: 'photo',
          z: p.z, sx: p.sx, sy: p.sy, size: cardSize,
          alpha: depthAlpha, img: photo.img, src: photo.src
        });
      });

      drawList.sort((a, b) => b.z - a.z);

      for (const item of drawList) {
        if (item.alpha <= 0.005) continue;

        if (item.type === 'star') {
          ctx.globalAlpha = item.alpha;
          ctx.fillStyle = item.bright ? '#fef9c3' : '#facc15';
          ctx.beginPath();
          ctx.arc(item.sx, item.sy, item.r, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.type === 'heart') {
          const hGlowR = 76 * sceneScale * item.scale * (1 + auraPulse * 0.12 + burstPower * 0.25);
          const hGlow = ctx.createRadialGradient(item.cx, item.cy, 2, item.cx, item.cy, hGlowR);
          hGlow.addColorStop(0, `rgba(254, 249, 195, ${(0.58 + burstPower * 0.25) * item.alpha})`);
          hGlow.addColorStop(0.45, `rgba(250, 204, 21, ${(0.26 + auraPulse * 0.08) * item.alpha})`);
          hGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = hGlow;
          ctx.beginPath();
          ctx.arc(item.cx, item.cy, hGlowR, 0, Math.PI * 2);
          ctx.fill();

          ctx.save();
          ctx.globalAlpha = item.alpha;
          ctx.shadowColor = '#fde047';
          ctx.shadowBlur = 28 + auraPulse * 10 + burstPower * 28;
          ctx.beginPath();
          item.pts.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(pt.sx, pt.sy);
            else ctx.lineTo(pt.sx, pt.sy);
          });
          ctx.closePath();
          ctx.strokeStyle = 'rgba(254, 249, 195, 0.98)';
          ctx.lineWidth = Math.max(1.2, 2.4 * item.scale);
          ctx.stroke();
          ctx.restore();

          drawGoldenFlower(item.cx, item.cy + 2 * item.scale, Math.max(4, 11 * item.scale * (1 + burstPower * 0.25)), item.alpha, time * 0.45);
        } else if (item.type === 'node') {
          const flowerSize = Math.max(3, 7.2 * item.scale);
          drawGoldenFlower(item.sx, item.sy - 14 * item.scale, flowerSize, item.alpha, item.rot);

          const fontSize = Math.max(8, Math.round(14 * item.scale));
          ctx.save();
          ctx.globalAlpha = item.alpha;
          ctx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillStyle = '#fef9c3';
          ctx.shadowColor = 'rgba(253, 224, 71, 0.95)';
          ctx.shadowBlur = 15;
          ctx.fillText(item.label, item.sx, item.sy + 6 * item.scale);
          ctx.restore();
        } else if (item.type === 'photo') {
          drawRoundedImageCard(item.img, item.sx, item.sy, item.size, item.alpha);
        }
      }

      ctx.globalAlpha = 1;

      for (let i = sparks3D.length - 1; i >= 0; i--) {
        const sp = sparks3D[i];
        sp.x += sp.vx * (dt * 60);
        sp.y += sp.vy * (dt * 60);
        sp.z += sp.vz * (dt * 60);
        sp.vy += 0.04 * sceneScale * (dt * 60);
        sp.life -= 0.022 * (dt * 60);

        if (sp.life <= 0) {
          sparks3D.splice(i, 1);
          continue;
        }

        const p = project3D(sp.x, sp.y, sp.z);
        if (!p) continue;

        ctx.save();
        ctx.globalAlpha = sp.life * sceneFade;
        ctx.fillStyle = '#fef9c3';
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, Math.max(0.8, sp.size * sp.life * p.scale), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
